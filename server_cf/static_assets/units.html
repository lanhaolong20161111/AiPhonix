<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>长度金字塔</title>
<style>
  :root {
    --ink: #2b2340;
    --paper: #fdf9f1;
    --card: #ffffff;
    --gold: #f5a623;
    --up: #e05656;
    --down: #2f9e6e;
    --shadow: 0 6px 24px rgba(43, 35, 64, .10);
    --r: 22px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background:
      radial-gradient(1200px 500px at 50% -100px, #ffefcf 0%, transparent 60%),
      var(--paper);
    color: var(--ink);
    min-height: 100vh;
    padding: 20px 14px 60px;
    max-width: 560px;
    margin: 0 auto;
  }

  /* ── 标题：一个大字 + 一个图标，不放长句 ── */
  header { text-align: center; margin-bottom: 8px; }
  h1 { font-size: clamp(30px, 8vw, 44px); margin: 0; letter-spacing: 2px; }
  .hint { font-size: 19px; opacity: .75; margin-top: 6px; }
  .hint b { color: var(--gold); }

  /* ── 选择状态条 ── */
  #status {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    min-height: 52px; margin: 10px auto 14px;
    background: var(--card); border-radius: 999px; box-shadow: var(--shadow);
    padding: 8px 20px; font-size: 22px; font-weight: 700; width: fit-content;
  }
  #status .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 12px; border-radius: 999px;
  }
  #status .arrow { font-size: 24px; opacity: .6; }

  /* ── 金字塔 ── */
  #pyramid {
    display: flex; flex-direction: column; align-items: center;
    gap: 8px; margin: 0 auto; width: 100%;
  }
  .band {
    --w: 100%;
    width: var(--w);
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 13px 8px;
    border: 4px solid transparent;
    border-radius: 16px;
    font-size: clamp(22px, 6vw, 30px);
    font-weight: 800;
    cursor: pointer;
    user-select: none;
    color: #fff;
    text-shadow: 0 2px 4px rgba(0,0,0,.22);
    transition: transform .25s, border-color .25s, filter .25s;
    position: relative;
    opacity: 0;
    animation: bandIn .9s ease forwards;
  }
  .band:nth-child(1) { animation-delay: .15s; }
  .band:nth-child(2) { animation-delay: .45s; }
  .band:nth-child(3) { animation-delay: .75s; }
  .band:nth-child(4) { animation-delay: 1.05s; }
  .band:nth-child(5) { animation-delay: 1.35s; }
  @keyframes bandIn { from { opacity: 0; transform: translateY(26px) } to { opacity: 1; transform: none } }

  .band .sym { font-size: .72em; opacity: .85; font-weight: 700; }
  .band .ref { font-size: clamp(26px, 7vw, 34px); filter: drop-shadow(0 2px 3px rgba(0,0,0,.25)); }
  .band.picked { border-color: #fff; transform: scale(1.04); filter: brightness(1.08); }
  .band.pulse { animation: pulse 1s ease 2; }
  @keyframes pulse { 50% { transform: scale(1.07); filter: brightness(1.2) } }

  /* 宽度做出金字塔轮廓 */
  .band[data-i="0"] { --w: 42%;  background: linear-gradient(180deg,#7b5cff,#6043e0); }
  .band[data-i="1"] { --w: 56%;  background: linear-gradient(180deg,#3f8cff,#2f6fdd); }
  .band[data-i="2"] { --w: 70%;  background: linear-gradient(180deg,#22b07d,#128a61); }
  .band[data-i="3"] { --w: 84%;  background: linear-gradient(180deg,#f0932b,#d97b06); }
  .band[data-i="4"] { --w: 100%; background: linear-gradient(180deg,#e05656,#c23a3a); }

  /* ── 移动小球（转换动画主角）── */
  #ball {
    position: fixed; z-index: 30; font-size: 34px; pointer-events: none;
    left: 0; top: 0; opacity: 0;
    transition: transform 1.4s cubic-bezier(.45,.05,.35,1), opacity .3s;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,.3));
  }
  #ball.show { opacity: 1; }

  /* ── ÷10 / ×10 徽章 ── */
  .badge {
    position: fixed; z-index: 31; pointer-events: none;
    font-size: clamp(24px, 6.5vw, 32px); font-weight: 900;
    padding: 8px 16px; border-radius: 999px;
    box-shadow: var(--shadow); opacity: 0;
    animation: badgePop 2.6s ease forwards;
    white-space: nowrap;
  }
  .badge.up   { background: #ffe3e3; color: var(--up);   border: 3px solid var(--up); }
  .badge.down { background: #d9f5e7; color: var(--down); border: 3px solid var(--down); }
  .badge.gold { background: #fff3d6; color: #9a6b00;     border: 3px solid var(--gold); }
  @keyframes badgePop {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(.2); }
    12%  { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
    20%  { transform: translate(-50%, -50%) scale(1); }
    78%  { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -80%) scale(1); }
  }

  /* ── 结果卡 ── */
  #result {
    margin: 22px auto 0; width: 100%;
    background: var(--card); border-radius: var(--r); box-shadow: var(--shadow);
    padding: 22px 16px; text-align: center;
    display: none;
  }
  #result.show { display: block; animation: cardIn .8s ease; }
  @keyframes cardIn { from { opacity: 0; transform: translateY(30px) } to { opacity: 1; transform: none } }

  #rulePill {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 24px; font-weight: 900; padding: 8px 20px; border-radius: 999px; margin-bottom: 12px;
  }
  #rulePill.up   { background: #ffe3e3; color: var(--up); }
  #rulePill.down { background: #d9f5e7; color: var(--down); }
  #rulePill.same { background: #eee9ff; color: #6043e0; }

  #resultMain { font-size: clamp(26px, 7.5vw, 38px); font-weight: 900; line-height: 1.5; }
  #resultMain .emo { font-size: 1.25em; }
  #resultSub { margin-top: 10px; font-size: 20px; opacity: .7; }

  /* ── 参照物卡片 ── */
  h2.sec { text-align: center; font-size: 24px; margin: 34px 0 14px; letter-spacing: 1px; }
  #refs { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .refcard {
    background: var(--card); border-radius: var(--r); box-shadow: var(--shadow);
    padding: 16px 10px; text-align: center; cursor: pointer;
    transition: transform .25s;
  }
  .refcard:active { transform: scale(.96); }
  .refcard .emo { font-size: 46px; line-height: 1; filter: drop-shadow(0 3px 4px rgba(0,0,0,.18)); }
  .refcard .u { font-size: 22px; font-weight: 900; margin-top: 8px; }
  .refcard .d { font-size: 17px; opacity: .72; margin-top: 3px; }

  /* ── ×10 楼梯链（双向：上排 ×10 去，下排 ÷10 回）── */
  #chain {
    margin-top: 30px; background: var(--card); border-radius: var(--r); box-shadow: var(--shadow);
    padding: 18px 10px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
    gap: 6px; row-gap: 14px;
  }
  #chain .node {
    padding: 7px 14px; border-radius: 14px; color: #fff; cursor: pointer;
    display: inline-flex; flex-direction: column; align-items: center; line-height: 1.2;
  }
  #chain .node .cn { font-size: 20px; font-weight: 900; }
  #chain .node .en { font-size: 13px; font-weight: 700; opacity: .85; }
  #chain .step { display: inline-flex; flex-direction: column; gap: 5px; }
  #chain .pill {
    font-size: 15px; font-weight: 900; padding: 3px 10px; border-radius: 999px;
    cursor: pointer; white-space: nowrap;
  }
  #chain .pill.down { background: #d9f5e7; color: var(--down); border: 2px dashed #8fd7b8; }
  #chain .pill.up   { background: #ffe3e3; color: var(--up);   border: 2px dashed #f3a7a7; }
  #chain .pill.gold { background: #fff3d6; color: #9a6b00;     border-color: var(--gold); }
  #chain .pill:active { transform: scale(.94); }

  /* ── 首页入口（右上角圆钮）── */
  #homeBtn {
    position: fixed; top: 12px; right: 12px; z-index: 40;
    width: 48px; height: 48px; border-radius: 50%;
    background: var(--card); box-shadow: var(--shadow);
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; text-decoration: none; border: 3px solid #eee2c8;
  }
  #homeBtn:active { transform: scale(.92); }

  /* ── 尺子：点一个例子，亮出那一段（真实尺寸 + 动画）── */
  #rulerCard {
    margin-top: 30px; background: var(--card); border-radius: var(--r); box-shadow: var(--shadow);
    padding: 18px 10px 16px;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 8px 0 6px; }
  .chips button {
    font-size: 17px; font-weight: 800; padding: 7px 13px; border-radius: 999px;
    border: 2.5px solid #d8d2e8; background: #f6f3ff; color: #4a3f78; cursor: pointer;
  }
  .chips button.on { background: #6043e0; border-color: #6043e0; color: #fff; }
  .chips button:active { transform: scale(.94); }
  .scroll { overflow-x: auto; }
  .stage { position: relative; width: max-content; margin: 0 auto; padding-top: 36px; }
  .rtag {
    position: absolute; top: 0; left: 0; opacity: 0; white-space: nowrap;
    transform: translateX(-100%);
    background: #6043e0; color: #fff; font-size: 17px; font-weight: 900;
    padding: 4px 12px; border-radius: 999px;
    transition: left 1.1s cubic-bezier(.3,.7,.3,1), opacity .35s;
    z-index: 2;
  }
  .rtag.out { transform: none; }
  .ruler {
    position: relative; height: 64px; overflow: hidden;
    background: linear-gradient(180deg, #fffef8, #fbf1d7);
    border: 3px solid #e2ce9c; border-radius: 10px;
  }
  .seg {
    position: absolute; top: 0; bottom: 0; left: 0; width: 0; height: auto;
    transition: width 1.15s cubic-bezier(.3,.7,.3,1);
  }
  .seg.c0 { background: rgba(96,67,224,.48); }
  .seg.c1 { background: rgba(240,147,43,.55); border-left: 3px dashed rgba(255,255,255,.9); }
  .ticks, .nums { position: absolute; inset: 0; pointer-events: none; }
  .ticks i { position: absolute; bottom: 0; width: 2px; background: #6b5b3e; }
  .ticks i.mm { height: 12px; opacity: .45; }
  .ticks i.mid { height: 19px; opacity: .65; }
  .ticks i.cm { height: 32px; background: #3f3421; }
  .nums i { position: absolute; bottom: 34px; transform: translateX(-50%);
            font-style: normal; font-size: 15px; font-weight: 800; color: #5a4a28; }
  .mruler {
    position: relative; width: 360px; height: 64px; overflow: hidden;
    background: linear-gradient(180deg, #fff8f4, #fdeae0);
    border: 3px solid #e7b9a0; border-radius: 10px;
  }
  .mcells { position: absolute; inset: 0; display: flex; }
  .mcells i {
    flex: 1; font-style: normal; display: flex; align-items: flex-end; justify-content: center;
    padding-bottom: 6px; font-size: 14px; font-weight: 800; color: #a05252;
    border-left: 2px solid rgba(160,82,82,.30);
  }
  .mcells i:first-child { border-left: none; }
  .mcells i.mk { color: #9a6b00; background: rgba(245,166,35,.20); }
  .mcells i.mk b { font-size: 11px; color: #9a6b00; margin-left: 3px; }
  .eq { text-align: center; font-size: 20px; font-weight: 900; color: #4a3f78; margin: 12px 0 2px; min-height: 27px; }
  .eq .to { color: #b45309; }
  .cap { text-align: center; font-size: 13.5px; opacity: .55; margin: 2px 0 14px; }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .01s !important; transition-duration: .01s !important; }
  }
</style>
</head>
<body>

<header>
  <a id="homeBtn" href="/web/" aria-label="返回首页">🏠</a>
  <h1>📏 长度金字塔</h1>
  <div class="hint">点 <b>两个</b> 单位，看怎么变</div>
</header>

<div id="status"><span style="opacity:.55">👆 点上面选单位</span></div>

<div id="pyramid" aria-label="长度单位金字塔"></div>
<div id="ball">⚽</div>

<div id="result">
  <div id="rulePill"></div>
  <div id="resultMain"></div>
  <div id="resultSub"></div>
</div>

<h2 class="sec">👀 1 个单位有多长？</h2>
<div id="refs"></div>

<h2 class="sec">📏 在尺子上看长度</h2>
<div id="rulerCard">
  <div id="egChips" class="chips"></div>
  <div class="scroll"><div class="stage">
    <div class="rtag" id="egTag"></div>
    <div class="ruler" id="egRuler">
      <div id="egSegs"></div>
      <div class="ticks" id="egTicks"></div>
      <div class="nums" id="egNums"></div>
    </div>
  </div></div>
  <div class="eq" id="egEq"></div>
  <div class="cap">真实大小 · 拿真尺子对一对</div>

  <div id="mChips" class="chips"></div>
  <div class="scroll"><div class="stage">
    <div class="rtag" id="mTag"></div>
    <div class="mruler" id="mRuler">
      <div id="mSegs"></div>
      <div class="mcells" id="mCells"></div>
    </div>
  </div></div>
  <div class="eq" id="mEq"></div>
  <div class="cap">示意图 · 每 1 大格 = 1分米 · 第 10 格右边 = 1米</div>
</div>

<h2 class="sec">🪜 楼梯：下去 ×10，上来 ÷10（千米↔米是 1000）</h2>
<div id="chain"></div>

<script>
(function () {
  "use strict";

  /* 数据：单位 / 符号 / 参照 emoji / 参照短句 / 颜色索引由 CSS 管 */
  var UNITS = [
    { name: "千米", sym: "km", ref: "🏟️", label: "跑道 2 圈半" },
    { name: "米",   sym: "m",  ref: "🚪", label: "门把手高"   },
    { name: "分米", sym: "dm", ref: "🖍️", label: "粉笔长"     },
    { name: "厘米", sym: "cm", ref: "👍", label: "指甲宽"     },
    { name: "毫米", sym: "mm", ref: "💳", label: "卡片厚"     },
  ];
  /* 相邻两级的倍数：km↔m 是 1000，其余 10 */
  function stepRatio(i, j) {           // i, j 为相邻索引
    var lo = Math.min(i, j), hi = Math.max(i, j);
    return (lo === 0 && hi === 1) ? 1000 : 10;
  }

  var pyramid = document.getElementById("pyramid");
  var statusEl = document.getElementById("status");
  var ball = document.getElementById("ball");
  var result = document.getElementById("result");
  var rulePill = document.getElementById("rulePill");
  var resultMain = document.getElementById("resultMain");
  var resultSub = document.getElementById("resultSub");

  var pick = [];        // 已选单位索引
  var busy = false;     // 动画中禁止再点
  var touched = false;  // 用户点过任何东西 ⇒ 开场演示不再自动跑

  /* ── 建金字塔 ── */
  UNITS.forEach(function (u, i) {
    var b = document.createElement("div");
    b.className = "band";
    b.dataset.i = i;
    b.innerHTML =
      '<span class="ref">' + u.ref + "</span>" +
      "<span>" + u.name + '</span><span class="sym">' + u.sym + "</span>";
    b.addEventListener("click", function () { onBand(i); });
    pyramid.appendChild(b);
  });
  var bands = pyramid.querySelectorAll(".band");

  /* ── 参照物卡片 ── */
  var refs = document.getElementById("refs");
  UNITS.slice().reverse().forEach(function (u) {   // 从小到大排：mm → km
    var i = UNITS.indexOf(u);
    var c = document.createElement("div");
    c.className = "refcard";
    c.innerHTML = '<div class="emo">' + u.ref + '</div><div class="u">1' + u.name +
                  '</div><div class="d">' + u.label + "</div>";
    c.addEventListener("click", function () {
      touched = true;
      var b = bands[i];
      b.classList.remove("pulse"); void b.offsetWidth; b.classList.add("pulse");
      b.scrollIntoView({ behavior: "smooth", block: "center" });
    });
    refs.appendChild(c);
  });

  /* ── 楼梯链：节点 = 中文+符号；每步 = 上「×10 →」下「← ÷10」，各播对应方向 ── */
  var chain = document.getElementById("chain");
  UNITS.forEach(function (u, i) {
    var n = document.createElement("span");
    n.className = "node";
    n.style.background = getComputedStyle(bands[i]).background;
    n.innerHTML = '<span class="cn">' + u.name + '</span><span class="en">' + u.sym + "</span>";
    n.addEventListener("click", function () { touched = true; onBand(i); });
    chain.appendChild(n);
    if (i < UNITS.length - 1) {
      var gold = (i === 0);              // km↔m 那步
      var wrap = document.createElement("span");
      wrap.className = "step";
      var dn = document.createElement("span");   // 金字塔往下 = 单位变小 = 数字变大 = ×
      dn.className = "pill down" + (gold ? " gold" : "");
      dn.textContent = gold ? "×1000 →" : "×10 →";
      dn.addEventListener("click", function () { touched = true; reset(); animate(i, i + 1); });
      var up = document.createElement("span");   // 往上 = ÷
      up.className = "pill up" + (gold ? " gold" : "");
      up.textContent = gold ? "← ÷1000" : "← ÷10";
      up.addEventListener("click", function () { touched = true; reset(); animate(i + 1, i); });
      wrap.appendChild(dn);
      wrap.appendChild(up);
      chain.appendChild(wrap);
    }
  });

  /* ── 选择逻辑：点 1 个 = 选中起点；点第 2 个 = 开始动画 ── */
  function onBand(i) {
    if (busy) return;
    touched = true;
    if (pick.length === 0) {
      pick = [i];
      bands[i].classList.add("picked");
      showPick();
    } else if (pick.length === 1) {
      if (pick[0] === i) { reset(); return; }   // 再点自己 = 取消
      pick.push(i);
      bands[i].classList.add("picked");
      showPick();
      animate(pick[0], pick[1]);
    } else {
      reset();
      pick = [i];
      bands[i].classList.add("picked");
      showPick();
    }
  }

  function showPick() {
    if (pick.length === 1) {
      var u = UNITS[pick[0]];
      statusEl.innerHTML = '<span class="chip" style="background:#eee9ff">' +
        u.ref + " " + u.name + "</span><span class='arrow'>→ ?</span>";
    } else if (pick.length === 2) {
      var a = UNITS[pick[0]], b = UNITS[pick[1]];
      statusEl.innerHTML =
        '<span class="chip" style="background:#eee9ff">' + a.ref + " " + a.name + "</span>" +
        '<span class="arrow">→</span>' +
        '<span class="chip" style="background:#ffe9c7">' + b.ref + " " + b.name + "</span>";
    }
  }

  function reset() {
    pick = [];
    bands.forEach(function (b) { b.classList.remove("picked"); });
    result.classList.remove("show");
    statusEl.innerHTML = '<span style="opacity:.55">👆 点上面选单位</span>';
  }

  /* ── 主动画：从 i 走到 j ── */
  function animate(from, to) {
    busy = true;
    var goingUp = to < from;             // 往金字塔上面 = 单位变大 = 数字变小 = 除法
    var stepIdxs = [];
    if (goingUp) { for (var k = from; k > to; k--) stepIdxs.push(k); }
    else { for (var k2 = from; k2 < to; k2++) stepIdxs.push(k2); }

    var ratio = 1;
    for (var s = 0; s < stepIdxs.length; s++) {
      ratio *= stepRatio.apply(null,
        goingUp ? [stepIdxs[s], stepIdxs[s] - 1] : [stepIdxs[s], stepIdxs[s] + 1]);
    }

    /* 1) 小球逐级走：每 1.5s 走一级，与徽章同节奏 */
    ball.textContent = goingUp ? "🚀" : "⚽";
    ball.style.transition = "none";
    var first = centerOf(bands[from]);
    ball.style.transform = "translate(" + (first.x - 17) + "px," + (first.y - 17) + "px)";
    ball.classList.add("show");
    void ball.offsetWidth;
    ball.style.transition = "";
    stepIdxs.forEach(function (idx, n) {
      var dest = centerOf(bands[goingUp ? idx - 1 : idx + 1]);
      setTimeout(function () {
        ball.style.transform = "translate(" + (dest.x - 17) + "px," + (dest.y - 17) + "px)";
      }, 200 + n * 1500);
    });

    /* 2) 每级弹一个徽章（1.5s 一个，慢） */
    stepIdxs.forEach(function (idx, n) {
      setTimeout(function () {
        var c = centerOf(bands[goingUp ? idx - 1 : idx + 1]);
        spawnBadge(idx, c, goingUp,
          stepRatio(idx, goingUp ? idx - 1 : idx + 1) === 1000);
      }, 350 + n * 1500);
    });

    /* 3) 落地出结果卡 */
    var totalMs = 350 + stepIdxs.length * 1500 + 500;
    setTimeout(function () {
      ball.classList.remove("show");
      showResult(from, to, goingUp, ratio);
      busy = false;
    }, totalMs);
  }

  function spawnBadge(i, c, goingUp, gold) {
    var el = document.createElement("div");
    var r = stepRatio(i, goingUp ? i - 1 : i + 1);
    el.className = "badge " + (gold ? "gold" : (goingUp ? "up" : "down"));
    el.textContent = goingUp ? ("÷" + r) : ("×" + r);
    el.style.left = c.x + "px";
    el.style.top = (c.y - 46) + "px";
    document.body.appendChild(el);
    setTimeout(function () { el.remove(); }, 2700);
  }

  function showResult(from, to, goingUp, ratio) {
    var big = goingUp ? to : from;       // 金字塔上层 = 大单位
    var small = goingUp ? from : to;
    var bu = UNITS[big], su = UNITS[small];
    var ratioStr = ratio >= 10000 ? ratio.toLocaleString("en-US") : String(ratio);

    rulePill.className = goingUp ? "up" : "down";
    rulePill.textContent = goingUp
      ? "⬆️ 向上 ÷" + ratioStr
      : "⬇️ 向下 ×" + ratioStr;

    if (goingUp) {
      resultMain.innerHTML = ratioStr + " " + su.sym + " <span class='emo'>" + su.ref +
        "</span> → 1 " + bu.sym + " <span class='emo'>" + bu.ref + "</span>";
      resultSub.textContent = su.name + "变小，除 " + ratioStr + " 次 → " + bu.name;
    } else {
      resultMain.innerHTML = "1 " + bu.sym + " <span class='emo'>" + bu.ref +
        "</span> → " + ratioStr + " " + su.sym + " <span class='emo'>" + su.ref + "</span>";
      resultSub.textContent = bu.name + "变大，乘 " + ratioStr + " → " + su.name;
    }

    result.classList.add("show");
    result.scrollIntoView({ behavior: "smooth", block: "nearest" });
    countUp(resultMain, ratioStr);
  }

  /* 结果里的数字慢慢数上去（把「×1000」数出来，孩子看得见「多」） */
  function countUp(container, targetStr) {
    var target = parseInt(targetStr.replace(/,/g, ""), 10);
    if (isNaN(target) || target <= 1) return;
    /* 找到含目标数字的文本节点（向上时在开头，向下时在箭头后面） */
    var node = null;
    var walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT);
    while (walker.nextNode()) {
      if (walker.currentNode.textContent.indexOf(targetStr) !== -1) { node = walker.currentNode; break; }
    }
    if (!node) return;
    var t0 = null, dur = 1400;
    function frame(ts) {
      if (!t0) t0 = ts;
      var p = Math.min((ts - t0) / dur, 1);
      p = 1 - Math.pow(1 - p, 3);        // easeOutCubic
      node.textContent = node.textContent.replace(
        /[\d,]{3,}/, Math.round(target * p).toLocaleString("en-US"));
      if (p < 1) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  /* ── 工具 ── */
  function centerOf(el) {
    var r = el.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }

  /* ══════════ 尺子：点一个例子，亮出那一段（移植自 math_units「尺子上看例子」，
     去文字版 —— 只留 例子钮 / 高亮动画 / 一行等式）══════════ */

  /* 量真实比例：探针 span 宽 10mm，读出浏览器眼里的 1 毫米 = 多少像素 */
  var pxPerMm = (function () {
    var p = document.createElement("span");
    p.style.cssText = "position:absolute;visibility:hidden;width:10mm;height:1px";
    document.body.appendChild(p);
    var w = p.getBoundingClientRect().width / 10;
    p.remove();
    return (w > 0 ? w : 96 / 25.4);
  })();

  var EG_MM = [5, 10, 25, 37, 70, 73, 98, 100];     // 学生尺例子（真实尺寸 0..10 厘米）
  var M_MM = [100, 500, 1000, 1200];                // 米尺例子（示意图 0..1.5 米）
  var M_PX = 360, M_FULL_MM = 1500;                 // 米尺固定画 360px = 1.5 米

  /* 复合读法：73 → 「7厘米3毫米」、1200 → 「1米2分米」（贪心从大单位拆，与 web 版一致） */
  function compound(mm) {
    var m = Math.floor(mm / 1000), rest = mm % 1000;
    var dm = Math.floor(rest / 100); rest %= 100;
    var cm = Math.floor(rest / 10), r = rest % 10, out = "";
    if (m) out += m + "米";
    if (dm) out += dm + "分米";
    if (cm) out += cm + "厘米";
    if (r) out += r + "毫米";
    return out || "0毫米";
  }
  /* 一段长度的整数写法：1200 → 「1米2分米 = 12分米 = 1200毫米」 */
  function eqLine(mm) {
    var alts = [], u = [[ "米", 1000 ], [ "分米", 100 ], [ "毫米", 1 ]];
    u.forEach(function (it) {
      if (mm % it[1] === 0) alts.push((mm / it[1]) + it[0]);
    });
    return compound(mm) + " <span class='to'>= " + alts.join(" = ") + "</span>";
  }

  /* 把 mm 拆成「厘米段 + 毫米段」。只有一段时也用 c0（不带虚线分界） */
  function partsOf(mm) {
    var cm = Math.floor(mm / 10) * 10, r = mm % 10, out = [];
    if (cm > 0 && r > 0) { out.push({ mm: cm, cls: "c0" }); out.push({ mm: r, cls: "c1" }); }
    else if (cm > 0) { out.push({ mm: cm, cls: "c0" }); }
    else { out.push({ mm: r, cls: "c0" }); }
    return out;
  }

  function buildTicks(el, fullMm) {
    var html = "";
    for (var i = 0; i <= fullMm; i++) {
      var c = i % 10 === 0 ? "cm" : i % 5 === 0 ? "mid" : "mm";
      html += "<i class='" + c + "' style='left:" + (i * 100 / fullMm) + "%'></i>";
    }
    el.innerHTML = html;
    var nums = "";
    for (var n = 0; n <= fullMm / 10; n++) {
      nums += "<i style='left:" + (n * 10) + "%'>" + n + "</i>";
    }
    document.getElementById("egNums").innerHTML = nums;
  }

  /* 通用：点例子 → 两段亮区从 0 长出来 + 标签跟着跑 */
  function makeRuler(cfg) {
    var segsEl = document.getElementById(cfg.segs);
    var tag = document.getElementById(cfg.tag);
    var eq = document.getElementById(cfg.eq);
    var chips = document.getElementById(cfg.chips);
    var pxPer = cfg.pxPerMm;
    var cur = -1;

    cfg.items.forEach(function (mm) {
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = compound(mm);
      b.addEventListener("click", function () {
        touched = true;
        select(mm);
      });
      chips.appendChild(b);
    });
    var btns = chips.querySelectorAll("button");

    /* 亮区骨架固定两段：c0（厘米段）+ c1（毫米段），改 left/width 就行 */
    ["c0", "c1"].forEach(function (c) {
      var s = document.createElement("span");
      s.className = "seg " + c;
      segsEl.appendChild(s);
    });
    var segEls = segsEl.querySelectorAll(".seg");

    function select(mm) {
      if (mm === cur) return;
      cur = mm;
      btns.forEach(function (b, i) { b.classList.toggle("on", cfg.items[i] === mm); });

      var parts = partsOf(mm), acc = 0, plan = [];
      segEls.forEach(function (s) {
        s.style.transition = "none";
        s.style.transitionDelay = "";
        s.style.width = "0px";
      });
      parts.forEach(function (p) {
        plan.push({ el: segEls[plan.length], left: acc * pxPer, w: p.mm * pxPer });
        acc += p.mm;
      });
      /* 标签先藏起来，等亮区到位再跟着右端跑 */
      tag.style.transition = "none";
      tag.style.opacity = "0";

      void segsEl.offsetWidth;   // 强制回流，让「归零」先生效

      segEls.forEach(function (s) { s.style.transition = ""; });
      plan.forEach(function (t, i) {
        t.el.style.left = t.left + "px";
        t.el.style.transitionDelay = (i * 0.35) + "s";
        t.el.style.width = t.w + "px";
      });
      var endX = mm * pxPer;
      var narrow = endX < 60;
      tag.classList.toggle("out", narrow);
      tag.style.transition = "";
      tag.style.left = (narrow ? endX + 4 : endX) + "px";
      tag.textContent = compound(mm);
      setTimeout(function () { tag.style.opacity = "1"; }, 500);
      eq.innerHTML = eqLine(mm);
    }
    return { select: select };
  }

  /* 学生尺：真实尺寸（1 毫米 = pxPerMm 像素），宽度跟着量出来的比例走 */
  var egRuler = document.getElementById("egRuler");
  egRuler.style.width = (100 * pxPerMm) + "px";
  buildTicks(document.getElementById("egTicks"), 100);
  var eg = makeRuler({
    segs: "egSegs", tag: "egTag", eq: "egEq", chips: "egChips",
    items: EG_MM, pxPerMm: pxPerMm,
  });

  /* 米尺：示意图（固定 360px 画 1.5 米，每大格 1 分米），比例与校准无关 */
  var mCellsEl = document.getElementById("mCells");
  var mHtml = "";
  for (var mi = 1; mi <= 15; mi++) {
    mHtml += mi === 10 ? "<i class='mk'>" + mi + "<b>1米</b></i>" : "<i>" + mi + "</i>";
  }
  mCellsEl.innerHTML = mHtml;
  var m = makeRuler({
    segs: "mSegs", tag: "mTag", eq: "mEq", chips: "mChips",
    items: M_MM, pxPerMm: M_PX / M_FULL_MM,
  });

  /* 开场：页面打开 0.8s 后自动亮出「7厘米3毫米」，不点也会演 */
  setTimeout(function () { eg.select(73); }, 800);
  setTimeout(function () { m.select(1000); }, 2200);

  /* 开场自动演示一次：毫米 → 米（向上 ÷10 三次），不用孩子读字就能看懂玩法 */
  setTimeout(function () {
    if (!touched && !busy) { pick = [4]; bands[4].classList.add("picked"); showPick(); }
  }, 2600);
  setTimeout(function () {
    if (!touched && pick.length === 1 && pick[0] === 4 && !busy) {
      pick.push(1); bands[1].classList.add("picked"); showPick(); animate(4, 1);
    }
  }, 4000);
})();
</script>
</body>
</html>
